<!DOCTYPE html>
<html>
<head>
    <title>Lab 7 – Brinton Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.4/dist/leaflet.css"/>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.3.4/dist/leaflet.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>

    <!-- jQuery UI (required later for slider) -->
    <script src="https://code.jquery.com/ui/1.9.2/jquery-ui.js"></script>

    <!-- CSV parser -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <!-- Fuse search libraries (required later) -->
    <script src="https://dsps.lib.uiowa.edu/placing/public/fuse-1.2.1/fuse.min.js"></script>
    <script src="https://dsps.lib.uiowa.edu/placing/public/leafletFuseSearch-noVersion/leafletfuse.js"></script>

    <link rel="stylesheet" href="https://dsps.lib.uiowa.edu/placing/public/leafletFuseSearch-noVersion/leafletfuse.css"/>

<style>

html, body {
    margin:0;
    padding:0;
    height:100%;
}

#map {
    width:100%;
    height:650px;
}

</style>
</head>

<body>

<div id="slider-container" style="width:300px; margin:10px;">
  <label for="yearSlider">Year: <span id="yearLabel">1890</span></label><br>
  <input type="range" id="yearSlider" min="1880" max="1910" value="1890" step="1">
</div>

<div id="map"></div>

<script>

// Create basemap
<script>

// create map
var map = L.map('map', {
    center: [41.9, -93.5],
    zoom: 7
});

// add basemap
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);


// GLOBAL VARIABLE so slider can access it
var brintonLayer;


// load the geojson
fetch("brinton_data_lab7.json")
.then(function(response){
    return response.json();
})
.then(function(data){

    brintonLayer = L.geoJSON(data, {

        pointToLayer: function(feature, latlng){
            return L.circleMarker(latlng, {
                radius: 6,
                fillColor: "red",
                color: "#000",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            });
        },

        onEachFeature: function(feature, layer){
            layer.bindPopup(
                "<b>" + feature.properties.name + "</b><br>" +
                "Year: " + feature.properties.year
            );
        }

    }).addTo(map);

});


// slider control
var slider = L.control({position: 'topright'});

slider.onAdd = function(map){
    var div = L.DomUtil.create('div','info slider');

    div.innerHTML =
    '<input id="yearSlider" type="range" min="1880" max="1920" step="1" value="1880">';

    return div;
};

slider.addTo(map);


// slider interaction
document.addEventListener("input", function(e){

    if(e.target.id === "yearSlider"){

        var year = Number(e.target.value);

        brintonLayer.eachLayer(function(layer){

            if(layer.feature.properties.year <= year){
                layer.addTo(map);
            } else {
                map.removeLayer(layer);
            }

        });

    }

});

</script>

</body>
</html>
