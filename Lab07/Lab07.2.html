<!DOCTYPE html>
<html>
<head>
<title>Lab 7 Part 2.2</title>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.3.4/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>

<script src="https://dsps.lib.uiowa.edu/placing/public/leafletSlider-1.0.2/leaflet.SliderControl.min.js"></script>
<script src="https://dsps.lib.uiowa.edu/placing/public/fuse-1.2.1/fuse.min.js"></script>
<script src="https://dsps.lib.uiowa.edu/placing/public/leafletFuseSearch-noVersion/leafletfuse.js"></script>

<link rel="stylesheet" href="https://dsps.lib.uiowa.edu/placing/public/leafletFuseSearch-noVersion/leafletfuse.css"/>

<script src="https://code.jquery.com/ui/1.9.2/jquery-ui.js"></script>
<script src="https://dsps.lib.uiowa.edu/placing/public/jqueryUiTouchPunch-0.2.2/jquery.ui.touch-punch.min.js"></script>

<style>

html, body {
    margin:0;
    padding:0;
    height:100%;
}

#map {
    width:100%;
    height:650px;
}

</style>

</head>

<body>

<div id="map"></div>

<script>

var basemap = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'&copy; OpenStreetMap contributors'
});

var map = L.map('map',
{
    center:[42,-93],
    zoom:7,
    layers:[basemap]
});

$.getJSON(
"https://michaelleiting13.github.io/Lab07/brinton_data_lab7.json",

function(data){

var brintonLayer = L.geoJson(data,
{

pointToLayer:function(feature,latlng){

return L.circleMarker(latlng,
{
radius:6,
fillColor:"#ED1C24",
color:"#ED1C24",
weight:1,
opacity:1,
fillOpacity:0.7
});

},

onEachFeature:function(feature,layer){

var popupContent =
"<strong>Name:</strong> "+feature.properties.name+
"<br><strong>Date:</strong> "+feature.properties.time;

layer.bindPopup(popupContent);

}

}).addTo(map);

});

</script>

</body>
</html>
