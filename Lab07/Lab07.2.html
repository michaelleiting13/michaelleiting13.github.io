<!DOCTYPE html>
<html>
<head>
<title>Lab 7 Part 2.2</title>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.3.4/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

html, body {
margin:0;
padding:0;
height:100%;
}

#map {
width:100%;
height:650px;
}

</style>
</head>

<body>

<div id="map"></div>

<script>

var basemap = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'&copy; OpenStreetMap contributors'
});

var map = L.map('map',
{
center:[42,-93],
zoom:7,
layers:[basemap]
});

Papa.parse("https://michaelleiting13.github.io/Lab07/brinton_data_lab7.csv", {

download: true,
header: true,

complete: function(results) {

var geojsonFeatures = [];

results.data.forEach(function(row){

if(row.latitude && row.longitude){

var feature = {
"type": "Feature",
"properties": {
"name": row.name,
"time": row.time
},
"geometry": {
"type": "Point",
"coordinates": [
parseFloat(row.longitude),
parseFloat(row.latitude)
]
}
};

geojsonFeatures.push(feature);

}

});

var geojsonData = {
"type": "FeatureCollection",
"features": geojsonFeatures
};

var brintonLayer = L.geoJson(geojsonData, {

pointToLayer:function(feature,latlng){

return L.circleMarker(latlng,{
radius:5,
fillColor:"#ED1C24",
color:"#ED1C24",
weight:1,
opacity:1,
fillOpacity:0.7
});

},

onEachFeature:function(feature,layer){

layer.bindPopup(
"<strong>Name:</strong> "+feature.properties.name+
"<br><strong>Date:</strong> "+feature.properties.time
);

}

}).addTo(map);
  map.removeLayer(brintonLayer);

var sliderControl = L.control.sliderControl({
    position: "topright",
    layer: brintonLayer,
    follow: true
});

map.addControl(sliderControl);

sliderControl.startSlider();
}

});


</script>

</body>
</html>
