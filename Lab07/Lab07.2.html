<!DOCTYPE html>
<html>
<head>

<title>Lab 7 Part 2.2</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.3.4/dist/leaflet.js" crossorigin=""></script>

<script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.9.2/jquery-ui.js"></script>

<script src="https://dsps.lib.uiowa.edu/placing/public/jqueryUiTouchPunch-0.2.2/jquery.ui.touch-punch.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="https://dsps.lib.uiowa.edu/placing/public/leafletSlider-1.0.2/leaflet.SliderControl.min.js"></script>

<link rel="stylesheet" href="https://dsps.lib.uiowa.edu/placing/public/leafletFuseSearch-noVersion/leafletfuse.css"/>
<script src="https://dsps.lib.uiowa.edu/placing/public/fuse-1.2.1/fuse.min.js"></script>
<script src="https://dsps.lib.uiowa.edu/placing/public/leafletFuseSearch-noVersion/leafletfuse.js"></script>

<style>
html, body {
margin:0;
padding:0;
height:100%;
}

#map {
width:100%;
height:650px;
}
</style>

</head>

<body>

<div id="map"></div>

<script>

var basemap = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'&copy; OpenStreetMap contributors'
});

var map = L.map('map',{
center:[42,-93],
zoom:7,
layers:[basemap]
});

Papa.parse(
"https://michaelleiting13.github.io/Lab07/brinton_data_lab7.csv",
{

download:true,
header:true,

complete:function(results){

var geojsonFeatures=[];

results.data.forEach(function(row){

if(row.latitude && row.longitude){

var feature={
"type":"Feature",
"properties":{
"name":row.name,
"time":row.time
},
"geometry":{
"type":"Point",
"coordinates":[
parseFloat(row.longitude),
parseFloat(row.latitude)
]
}
};

geojsonFeatures.push(feature);

}

});

var geojsonData={
"type":"FeatureCollection",
"features":geojsonFeatures
};

var brintonLayer=L.geoJson(geojsonData,{

pointToLayer:function(feature,latlng){

return L.circleMarker(latlng,{
radius:5,
fillColor:"#ED1C24",
color:"#ED1C24",
weight:1,
opacity:1,
fillOpacity:0.7
});

},

onEachFeature:function(feature,layer){

layer.bindPopup(
"<strong>Name:</strong> "+feature.properties.name+
"<br><strong>Date:</strong> "+feature.properties.time
);

}

});

map.addLayer(brintonLayer);

map.removeLayer(brintonLayer);

var sliderControl = L.control.sliderControl({
position:"topright",
layer:brintonLayer,
follow:true
});

map.addControl(sliderControl);

sliderControl.startSlider();

}

});

</script>

</body>
</html>
