<!DOCTYPE html>
<html>
  <head>
      <meta charset="utf-8">
      <title>Lab07.1</title>

      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.4/dist/leaflet.css"/>
      <script src="https://unpkg.com/leaflet@1.3.4/dist/leaflet.js"></script>

      <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
      <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

      <style>
          html, body { margin: 0; padding: 0; height: 100%; }
          #map { min-height: 100%; }
      </style>
  </head>

  <body>
      <div id="map"></div>

      <script>

          var map = L.map('map', {
                center: [38.1625228, -96.9633171],
                zoom: 4
            });

             L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map); // stamen map causing issues? changed to this open streetmap tile layer
            $.getJSON("https://rshepard2.github.io/city.geojson")
                .done(function(data) {
                var info = processData(data);
                    createPropSymbols(info.timestamps, data);
                 createSliderUI(info.timestamps);
            function processData(data) {
                var timestamps = [];
                var min = Infinity;
                var max = -Infinity;

                for (var feature in data.features) {
                    var properties = data.features[feature].properties;

                for (var attribute in properties) {

                if ( attribute != 'id' &&
               attribute != 'name' &&
               attribute != 'latitude' &&
               attribute != 'longitude' ) {

                if ($.inArray(attribute, timestamps) === -1) {
                  timestamps.push(attribute);
                }

                if (properties[attribute] < min) {
                  min = properties[attribute];
                }

                if (properties[attribute] > max) {
                  max = properties[attribute];
                }

            }
        }
    }

                return {
                    timestamps: timestamps,
                    min: min,
                    max: max
                };
            }
        });
        function createPropSymbols(timestamps, data) {

        cities = L.geoJson(data, {

        pointToLayer: function(feature, latlng) {

            return L.circleMarker(latlng, {

                fillColor: "#501e65",  // fill color of the circles
                color: "#501e65",      // border color of the circles
                weight: 2,             // circle line weight in pixels
                fillOpacity: 0.5       // fill opacity (0-1)

            }).on({

                mouseover: function(e) {
                    this.openPopup();
                    this.setStyle({ fillColor: 'green' });
                },

                mouseout: function(e) {
                    this.closePopup();
                    this.setStyle({ fillColor: '#501e65' });
                }

            });

        }

    }).addTo(map);

    updatePropSymbols(timestamps[0]); // show first timestamp
}
function updatePropSymbols(timestamp) {

  cities.eachLayer(function(layer) {

      var props = layer.feature.properties;

      var radius = calcPropRadius(props[timestamp]);

      // pop-up information
      var popupContent = props.name + ' ' + timestamp + 
                         ' population: ' + 
                         String(props[timestamp]);

      layer.setRadius(radius);

      layer.bindPopup(popupContent, {
          offset: new L.Point(0, -radius)
      });

  });

}
function calcPropRadius(attributeValue) {

  var scaleFactor = 0.001;  

  var area = attributeValue * scaleFactor;

  return Math.sqrt(area / Math.PI);

}
function createSliderUI(timestamps) {

  var sliderControl = L.control({ position: 'bottomleft' });

  sliderControl.onAdd = function(map) {

      var slider = L.DomUtil.create("input", "range-slider");

      L.DomEvent.addListener(slider, 'mousedown', function(e) {
          L.DomEvent.stopPropagation(e);
      });

      var labels = ["1950", "1960", "1970", "1980", "1990", "2000", "2010"];

      $(slider)
          .attr({
              'type': 'range',
              'max': timestamps[timestamps.length - 1],
              'min': timestamps[0],
              'step': 10,
              'value': timestamps[0]
          })
          .on('input change', function() {

              updatePropSymbols($(this).val().toString());

              var i = $.inArray(this.value, timestamps);

              $(".temporal-legend").text(labels[i]);

          })
          .mousedown(function () {
              map.dragging.disable();
          });

      return slider;
  };

  sliderControl.addTo(map);

  createTimeLabel("1950");
}
function createTimeLabel(startTimestamp) {

    var temporalLegend = L.control({ position: 'bottomleft' });

    temporalLegend.onAdd = function(map) {

        var output = L.DomUtil.create("output", "temporal-legend");

        $(output).text(startTimestamp);

        return output;
    };

    temporalLegend.addTo(map);
}
      </script>
  </body>
</html>
